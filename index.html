function mkDay(d,rt){let n=0;DB.giochay.forEach(g=>{if(rt&&norm(g.TUYẾN)!==rt)return;if(/KHÓA|ĐÓNG|NGHỈ|TẠM/i.test(g['TRẠNG THÁI']||''))return;if(DB.lich.some(l=>l.NGÀY===d&&norm(l.TUYẾN)===norm(g.TUYẾN)&&l.GIỜ===g.GIỜ))return;const e=nvBy(g['TÊN LÁI XE']),x=DB.xe.find(v=>v['SỐ XE']===g['SỐ XE'])||{};DB.lich.push({KEY:uid(),NGÀY:d,TUYẾN:g.TUYẾN,GIỜ:g.GIỜ,'SỐ XE':g['SỐ XE'],'TÊN LÁI XE':g['TÊN LÁI XE'],'SỐ ĐIỆN THOẠI':e['SỐ ĐIỆN THOẠI']||'','HẠNG BẰNG':e['GIỚI TÍNH']==='NỮ'?'':(e['HẠNG BẰNG']||''),'SỐ CHUYẾN':1,'TIỀN CÔNG':g['SỐ XE']?wage(x):'','NGƯỜI CHẤM CÔNG':'TỰ ĐỘNG'});n++});return n}
function doGen(){const a=$('#gd').value,b=$('#gd2').value||a,rt=$('#gr').value;if(!a)return toast('Chọn ngày bắt đầu');

function auto(){if(U&&!admin())return;if(!DB.cfg.auto||!DB.giochay.length)return;const n=new Date(),f=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,td=f(n),tm=f(new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)),

function imp(f){if(!f)return;ask('Nhập từ file sẽ thay thế dữ liệu hiện có trên thiết bị này. Tiếp tục?',()=>{
 const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array',cellDates:true}),nd={};
